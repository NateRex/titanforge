name: Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  # Build
  build:
    name: 🛠️ Build
    runs-on: ubuntu-latest
    container: natejrex/cmake-vcpkg
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Dependency Cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build/vcpkg_installed
          key: ${{ runner.os }}-cache-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-cache-${{ hashFiles('vcpkg.json') }}

      - name: Execute Commands
        run: |
          if [ -d ".build/vcpkg_installed" ]; then
            echo "CACHE_HIT=true" >> $GITHUB_ENV
          else
            echo "CACHE_HIT=false" >> $GITHUB_ENV
          fi
          cd .build
          cmake .. -Wno-dev
          cmake --build .
          cd ..

      - name: Save Dependency Cache (On Cache Miss; Default Branch Only)
        if: env.CACHE_HIT != 'true' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .build/vcpkg_installed
          key: ${{ runner.os }}-cache-${{ hashFiles('vcpkg.json') }}

      - name: Upload Artifact -> build
        uses: actions/upload-artifact@v4
        with:
          name: build
          include-hidden-files: true
          path: .build
          retention-days: 1

  # Common Tests
  common-tests:
    name: 🧪 Common Tests
    runs-on: ubuntu-latest
    container: natejrex/cmake-vcpkg
    needs:
      - build
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Download Artifact -> build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .build

      - name: Execute Commands
        run: ./.github/scripts/runTest.sh ./.build/packages/common_test/bin/CommonTest


  # Graphics Tests
  graphics-tests:
    name: 🧪 Graphics Tests
    runs-on: ubuntu-latest
    container: natejrex/cmake-vcpkg
    needs:
      - build
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Download Artifact -> build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .build

      - name: Execute Commands
        run: |
          Xvfb :99 -screen 0 1024x768x16 &
          export DISPLAY=:99
          ./.github/scripts/runTest.sh ./.build/packages/graphics_test/bin/GraphicsTest

  # Math Tests
  math-tests:
    name: 🧪 Math Tests
    runs-on: ubuntu-latest
    container: natejrex/cmake-vcpkg
    needs:
      - build
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Download Artifact -> build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .build

      - name: Execute Commands
        run: ./.github/scripts/runTest.sh ./.build/packages/math_test/bin/MathTest

  # Generate Documentation
  generate-docs:
    name: 📄 Generate Documentation
    runs-on: ubuntu-latest
    container: natejrex/cmake-vcpkg
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Documentation
        run: doxygen Doxyfile

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs/html

  # Deploy Documentation
  deploy-docs:
    name: 📄 Deploy Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs:
      - api-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
